<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --navy-900: #0b1e3d;
  --navy-700: #1b3763;
  --blue: #2f6fed;
  --teal: #0f9d82;
  --gold: #c79a3c;
  --red: #c13b3b;
  --bg: #f2f5fa;
  --surface: #ffffff;
  --border: #e2e7f0;
  --text: #14213d;
  --muted: #5c6a86;
  --radius-lg: 22px;
  --shadow-card: 0 1px 2px rgba(15,30,60,.05), 0 12px 32px rgba(15,30,60,.08);
  --font-head: 'Manrope', Arial, sans-serif;
  --font-body: 'Inter', Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  padding: 24px;
}

.panel {
  width: min(480px, 100%);
  padding: 38px 34px;
  border-radius: var(--radius-lg);
  background: var(--surface);
  border: 1px solid var(--border);
  text-align: center;
  box-shadow: var(--shadow-card);
  animation: riseIn .5s ease both;
}

@keyframes riseIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 6px;
}

.logout-btn {
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: var(--radius-lg);
  padding: 8px 16px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: .82rem;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  flex-shrink: 0;
}

.logout-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(193,59,59,.25); opacity: .95; }
.logout-btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.title {
  margin: 0;
  font-family: var(--font-head);
  font-size: clamp(1.5rem, 3vw, 1.9rem);
  letter-spacing: -.01em;
  color: var(--navy-900);
  text-align: left;
}

.subtext {
  color: var(--muted);
  margin: 14px auto 0;
  max-width: 400px;
  line-height: 1.7;
  font-size: .93rem;
}

.loader {
  margin: 30px auto 0;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 4px solid var(--border);
  border-top-color: var(--blue);
  animation: spin .9s linear infinite;
  display: none;
  opacity: 0;
  transition: opacity .2s ease;
}

.loader.active { display: block; opacity: 1; }

.status {
  margin-top: 22px;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: .92rem;
  font-weight: 500;
}

.status::after {
  content: " ";
  animation: dots 1.2s infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

@keyframes dots {
  0% { content: ""; }
  25% { content: "."; }
  50% { content: ".."; }
  75% { content: "..."; }
  100% { content: ""; }
}

@media (max-width: 520px) {
  .panel { padding: 28px 22px; }
  .panel-header { flex-wrap: wrap; }
  .title { font-size: 1.5rem; }
}

@media (prefers-reduced-motion: reduce) {
  .panel { animation: none; }
  .loader { animation: none; }
}
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-header">
      <h1 class="title">Welcome, Admin</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <p class="subtext">Your dashboard is loading. When it is ready, you will be taken to the admin control center.</p>
    <div class="status" id="adminStatus">Verifying admin session...</div>
    <div class="loader active" id="loader"></div>
  </div>

<script type="module">
  import { db, auth } from "./firebase.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const adminStatus = document.getElementById("adminStatus");

  // Re-uses the SAME Firebase Admin authentication + Firestore "role" check
  // already used by admin-login.html / admin-dashboard.html.
  // No new auth system, no Firebase config changes, no Firestore changes.
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      adminStatus.textContent = "Session not found. Redirecting to Admin Login...";
      adminStatus.style.color = "#f87171";
      setTimeout(() => { window.location.replace("admin-login.html"); }, 900);
      return;
    }

    try {
      const userSnap = await getDoc(doc(db, "users", user.uid));
      const isAdmin = userSnap.exists() && userSnap.data().role === "admin";

      if (!isAdmin) {
        adminStatus.textContent = "This account is not authorized for Admin access.";
        adminStatus.style.color = "#f87171";
        await signOut(auth);
        setTimeout(() => { window.location.replace("admin-login.html"); }, 1200);
        return;
      }

      adminStatus.textContent = "Welcome to Admin Dashboard. Loading...";
      adminStatus.style.color = "#22c55e";

      setTimeout(() => {
        window.location.replace("admin-dashboard.html");
      }, 1200);
    } catch (err) {
      console.error("Welcome screen verification error:", err);
      adminStatus.textContent = "Something went wrong. Redirecting to Admin Login...";
      adminStatus.style.color = "#f87171";
      setTimeout(() => { window.location.replace("admin-login.html"); }, 1200);
    }
  });

  window.logout = async function logout() {
    // Import Firebase auth dynamically
    const { getAuth, signOut } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    
    const firebaseConfig = {
      apiKey: "AIzaSyAw_VjcITG-Rltan00gLQF7gui64O1hfPo",
      authDomain: "kasi-76cbd.firebaseapp.com",
      projectId: "kasi-76cbd",
      storageBucket: "kasi-76cbd.appspot.com",
      messagingSenderId: "887548997152",
      appId: "1:887548997152:web:ce02811972446a86a15645"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    await signOut(auth);
    window.location.href = "role-selector.html";
  }
</script>
</body>
</html>
